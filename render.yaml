services:
  - type: web
    name: homeops-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SAFETY_ALLOW_INFORMATIONAL_ACTIONS
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
